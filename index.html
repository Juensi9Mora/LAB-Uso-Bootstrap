<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarjeta Personal con Bootstrap</title>

    <!-- TAREA 1: Bootstrap por CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- TAREA 2: contenedor -->
    <div class="container py-4">

        <h1 class="mb-4">Mi Tarjeta Personal</h1>

        <!-- TAREA 3: tres botones -->
        <div class="mb-4">
            <button type="button" class="btn btn-primary">Primario</button>
            <button type="button" class="btn btn-success">Éxito</button>
            <button type="button" class="btn btn-danger">Peligro</button>
        </div>

        <!-- TAREA 4: alineación de texto -->
        <p class="text-start">Izquierda</p>
        <p class="text-center text-danger">Centro</p>
        <p class="text-end">Derecha</p>

        <!-- TAREA 5: tarjeta con encabezado -->
        <div class="card mx-auto mt-4" style="max-width: 20rem;">

            <div class="card-header">
                Mi Perfil
            </div>

            <!-- Avatar dibujado con IA. -->
            <img class="card-img-top"
                alt="Avatar"
                src="Captura.PNG">

            <ul class="list-group list-group-flush">
                <li class="list-group-item">Nombre: Juensi Carolayn Ayala Mora</li>
                <li class="list-group-item">Ciudad: Bogota, Colombia</li>
                <li class="list-group-item">Hobby: Pintar</li>
            </ul>

        </div>

    </div>

    <!-- TAREA 1: traer bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
